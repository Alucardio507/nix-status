[package]
name = "nixos-status"
version = "0.1.3"
edition = "2024"
description = "terminal display for NixOS channel status"
license = "MIT"
readme = "README.md"

[[bin]]
name = "nixos-status"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"     # optimize for size instead of speed
lto = true          # whole-program optimization, drops unused code
codegen-units = 1   # better optimization, slower build
panic = "abort"     # removes unwinding machinery
strip = true        # removes symbols and debug info
