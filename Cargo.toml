[package]
name = "nixos-status"
version = "0.1.0"
edition = "2021"
description = "A tiny terminal dashboard for NixOS channel status"
license = "MIT"
readme = "README.md"

[[bin]]
name = "nixos-status"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1.0"
